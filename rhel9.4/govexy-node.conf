# GovExy web node — shared configuration
#
# Sourced by both 01-install-dependencies.sh and 02-configure-nginx-php.sh.
# Keep this file beside the scripts. Edit here, not inside the scripts.

# ── Identity / locale ────────────────────────────────────────────────────────
SERVER_TZ="Asia/Dubai"
NODE_HOSTNAME=""                       # e.g. "web1.govexy.local"; empty = leave unchanged

# "primary" | "secondary". EXACTLY ONE node in the estate is primary.
#
# The primary is the node that runs migrations (04-deploy.sh --primary) and the
# only node that carries the Laravel scheduler cron. Laravel's scheduler has no
# cross-host lock, so a second copy fires workflow:process-scheduled twice a
# minute and every triggered workflow executes twice — two emails, two record
# updates. 05-configure-workers.sh refuses --scheduler unless this says primary.
#
# Horizon and the meter ingest run on EVERY node regardless; see that script.
#
# Defaults to "secondary" so that a node provisioned from an unedited copy of
# this file cannot become a second scheduler by omission. Setting the primary is
# a deliberate act, exactly once per estate.
NODE_ROLE="secondary"

# ── Backing services ─────────────────────────────────────────────────────────
REDIS_HOST="10.32.46.95"               # redis server IP

# Load balancer — OPTIONAL, leave empty until it exists.
# Do NOT guess. This becomes nginx's set_real_ip_from allowlist: it decides whose
# X-Forwarded-For header is believed. A wrong value does not error — it tells nginx
# to trust a forged header from whoever actually occupies that address, which
# defeats rate limiting and poisons audit logs. Empty = directive omitted (safe).
# Add later:  bash 02-configure-nginx-php.sh --set-lb <ip> [<ip>...]
LB_IPS="10.33.80.218"                              # space separated if the LB is clustered

# ── Application ──────────────────────────────────────────────────────────────
APP_ROOT="/var/www/govexy"             # Laravel root; public/ lives under this

# ── Install options ──────────────────────────────────────────────────────────
INSTALL_IMAGICK="yes"                  # PDF thumbnails + better image conversions

# Node.js — only needed if front-end assets are built ON the server.
# Vite 7 (this app's bundler) requires Node ^20.19 || >=22.12, so stream 20 is
# NOT sufficient on its own; 22 is the safe choice. Comes from RHEL AppStream,
# so no external repository and no extra proxy exception.
#
# Set to "no" if you build assets on a CI/build host and ship public/build with
# the artifact — the preferable arrangement, since the web nodes then carry no
# toolchain and no node_modules.
INSTALL_NODE="yes"
NODE_STREAM="22"                       # AppStream module stream: 18 | 20 | 22

# ── Runtime tuning ───────────────────────────────────────────────────────────
#
# PHP_MEMORY_LIMIT applies to the FPM pool only, set with php_admin_value in
# www.conf. It is NOT written to /etc/php.d/99-govexy.ini, which both SAPIs read
# — a web-sized limit there also caps artisan, and that covers Horizon workers,
# schedule:run, metering:ingest-edge, theme:publish-assets and the content-bundle
# importers. PHP_CLI_MEMORY_LIMIT is the CLI's own ceiling.
#
# Note the arithmetic before raising either: FPM_MAX_CHILDREN x PHP_MEMORY_LIMIT
# is the theoretical worst case for the pool (50 x 512M = 25 GB). Size the node
# against it or lower FPM_MAX_CHILDREN.
PHP_MEMORY_LIMIT="512M"
PHP_CLI_MEMORY_LIMIT="1024M"

# PHP_UPLOAD_MAX is the largest SINGLE FILE. PHP_POST_MAX must EXCEED it.
#
# A multipart request carrying a 128M file is always larger than 128M once
# boundaries, field names and the CSRF token are counted. PHP discards the whole
# body when post_max_size is exceeded and raises nothing — $_POST and $_FILES
# come back empty, Laravel sees no CSRF token and returns 419, which reads as a
# session problem rather than a size one. nginx's client_max_body_size follows
# PHP_POST_MAX for the same reason.
PHP_UPLOAD_MAX="128M"
PHP_POST_MAX="160M"
FPM_MAX_CHILDREN="50"

# ── Firewall ─────────────────────────────────────────────────────────────────
RESTRICT_HTTP_TO_LB="no"               # "yes" = only LB_IPS may reach :80 (needs LB_IPS)

# ── Security headers ─────────────────────────────────────────────────────────
# ── Bandwidth meter log ──────────────────────────────────────────────────────
#
# A second, dedicated nginx access log carrying one line per request, drained by
# `php artisan metering:ingest-edge` under a systemd timer on THIS node (stage 5).
# It is THE per-tenant bandwidth meter — nothing in the PHP request path counts
# bytes any more. If this log is not written, or not drained, tenant bandwidth
# is not billed.
#
# METER_LOG_GROUP must be a group the application user belongs to. nginx writes
# the files 0640, so without that membership the reader silently reads nothing.
METER_LOG="yes"
METER_LOG_DIR="/var/log/govexy-meter"
METER_LOG_GROUP="nginx"                # group that may READ the meter log

SECURITY_HEADERS="yes"                 # "no" only if an upstream tier already sets them

HSTS_MAX_AGE="31536000"                # 1 year. Emitted ONLY when the request arrived
                                       # over HTTPS (X-Forwarded-Proto: https), because
                                       # browsers ignore HSTS on a plaintext response
                                       # and sending it early is meaningless noise.
HSTS_INCLUDE_SUBDOMAINS="yes"
HSTS_PRELOAD="no"                      # Do not enable casually. Preload is a one-way
                                       # door: every current and future subdomain of the
                                       # registrable domain must serve valid HTTPS, and
                                       # removal from the browser preload list takes
                                       # months. Needs sign-off, not a config flip.

# X-Frame-Options. MUST stay SAMEORIGIN — the visual page builder renders its page
# preview in an iframe and drives it over postMessage. DENY breaks page editing.
FRAME_OPTIONS="SAMEORIGIN"

# Content-Security-Policy: "no" | "report-only" | "enforce"
#
# Default is deliberately "no". Tenants can enable Google Analytics, GTM, Facebook
# Pixel and reCAPTCHA from the dashboard, and themes may load their own assets — a
# CSP that does not enumerate those origins silently breaks tenant sites, and the
# breakage shows up as "analytics stopped working" weeks later, not as an error.
#
# Roll it out as "report-only" first, collect violations, then move to "enforce".
# The starting policy below still carries 'unsafe-inline' and 'unsafe-eval' because
# Filament v5 + Livewire 4 + Alpine require them; that is weak, and tightening it
# properly means nonce-based script tags, which is a code change, not a config one.
CSP_MODE="no"
CSP_REPORT_URI=""                      # optional endpoint for report-only violations

# ── Deploy ───────────────────────────────────────────────────────────────────
# Run the Pest suite as a gate before migrations. Costs ~10 minutes of
# maintenance mode per node and blocks the deploy on failure.
# "false" makes skipping the default for this environment; --with-tests on the
# command line still overrides it either way.
DO_TESTS=true
